name: Deploy No'j OS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Wrangler
        run: npm ci

      - name: Revisar credenciales
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Falta el secreto CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          npx wrangler whoami

      - name: Crear el proyecto de Pages (solo la primera vez)
        run: npx wrangler pages project create noj-os --production-branch main || echo "El proyecto ya existe, sigo."

      - name: Migraciones de la base (D1)
        run: npx wrangler d1 migrations apply noj-os --remote

      - name: Publicar en Cloudflare Pages
        run: npx wrangler pages deploy public --project-name=noj-os --branch=${{ github.ref_name }} --commit-dirty=true
